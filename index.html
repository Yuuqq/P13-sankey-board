<body>
  <main aria-label="主内容区域" class="app">
    <header class="hero">
      <h1>黑金流向桑基图快捷画板</h1>
      <p>输入“来源 -> 去向 金额”文本，自动生成资金流向桑基图。</p>
      <p class="note">示例：A公司 -> B公司 500</p>
    </header>

    <section class="card">
      <details class="teach-card" open>
        <summary>🎓 桑基图在调查报道中的应用</summary>
        <p>桑基图（Sankey Diagram）是一种用于展示“流向”关系的可视化图表，带宽与数量成正比。在新闻调查中常用于：<strong>资金流向追踪</strong>（如政治献金、贪腐案资金链）、<strong>信息传播路径</strong>（虚假信息扩散路线）、<strong>资源分配</strong>（财政预算分流）等场景。</p>
      </details>
    </section>

    <section class="card">
      <label for="input">关系输入（每行一条）</label>
      <textarea id="input" rows="10"></textarea>
      <div class="actions">
        <button id="drawBtn" type="button" aria-label="draw">生成桑基图</button>
        <button id="exportSvgBtn" type="button" class="btn-secondary" aria-label="export Svg">导出 SVG</button>
        <button id="exportPngBtn" type="button" class="btn-secondary" aria-label="export Png">导出 PNG</button>
      </div>
      <p id="status" role="status" aria-live="polite">状态: 等待输入</p>
    </section>

    <section class="card">
      <div id="chart" class="chart"></div>
    </section>
  </main>
