<body>
  <main class="app">
    <header class="hero">
      <h1>黑金流向桑基图快捷画板</h1>
      <p>输入“来源 -> 去向 金额”文本，自动生成资金流向桑基图。</p>
      <p class="note">示例：A公司 -> B公司 500</p>
    </header>

    <section class="card">
      <label for="input">关系输入（每行一条）</label>
      <textarea id="input" rows="10"></textarea>
      <div class="actions">
        <button id="drawBtn" type="button">生成桑基图</button>
        <button id="exportSvgBtn" type="button" class="btn-secondary">导出 SVG</button>
        <button id="exportPngBtn" type="button" class="btn-secondary">导出 PNG</button>
      </div>
      <p id="status" aria-live="polite">状态: 等待输入</p>
    </section>

    <section class="card">
      <div id="chart" class="chart"></div>
    </section>
