<html lang="zh-CN" class="type-scale-v22">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F0E6CF" />
  <meta name="theme-color" content="#241B11" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark">
  <title>P13 黑金流向桑基图快捷画板</title>
  <link rel="stylesheet" href="../shared/design-tokens.css" />
  <link rel="stylesheet" href="../shared/modern-styles.css" />
  <link rel="stylesheet" href="../shared/tool-chrome.css" />
  <link rel="stylesheet" href="./styles.css" />
  <meta name="description" content="黑金流向桑基图快捷画板。P13 黑金流向桑基图快捷画板" />
  <meta property="og:title" content="P13 黑金流向桑基图画板" />
  <meta property="og:description" content="黑金流向桑基图画板 — 前端纯静态新闻工具" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://yuuqq.github.io/P13-sankey-board/" />
  <link rel="manifest" href="./manifest.json" />
</head>

<body>
  <a href="#main" class="skip-link">跳到主内容 / Skip to main content</a>
  <div class="app">
    <header class="tool-chrome" data-tool-id="P13">
      <a class="tool-chrome__mark" href="../P00-dashboard/">新闻实验工具</a>
      <span class="tool-chrome__id">P13</span>
    </header>

    <details class="tool-teach">
      <summary>如何使用</summary>
      <p>每行一条「来源 -&gt; 去向 金额」，井号开头是注释。点「生成桑基图」后可导出 SVG 或 PNG，计算在本机完成。</p>
      <p>桑基图用条带宽度表示数量。调查报道里常用来追踪资金流向、信息传播路径和资源分配。示例数据仅供课堂。</p>
    </details>

    <main id="main" aria-label="主内容区域">
      <header class="hero">
        <h1>黑金流向桑基图快捷画板</h1>
        <p>输入“来源 -&gt; 去向 金额”文本，自动生成资金流向桑基图。</p>
        <p class="note">示例：A公司 -&gt; B公司 500</p>
      </header>

      <section class="card">
        <label for="input">关系输入（每行一条）</label>
        <textarea id="input" rows="10"></textarea>
        <div class="actions">
          <button id="drawBtn" type="button">生成桑基图</button>
          <button id="exportSvgBtn" type="button" class="btn-secondary">导出 SVG</button>
          <button id="exportPngBtn" type="button" class="btn-secondary">导出 PNG</button>
        </div>
        <p id="status" role="status" aria-live="polite">状态: 等待输入</p>
      </section>

      <section class="card chart-card">
        <div id="chart" class="chart"></div>
      </section>
    </main>

    <footer class="tool-footer">
      数据边界以附录 A 为准：能在本机完成的计算不主动外发；示例数据仅供课堂；本工具输出不得单独当作结论。
      <a href="../P00-dashboard/">返回工具箱</a>
    </footer>
  </div>
  <script src="../shared/vendor/echarts.min.js"></script>
  <script src="./pm-metrics.js" defer></script>
  <script src="./graph.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="../shared/releases/v2.6/loader.js" data-modules="dark,cmd,toast,onboarding,pedagogy-p1,pedagogy-p2,nav,kbd"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}</script>
</body>

</html>
